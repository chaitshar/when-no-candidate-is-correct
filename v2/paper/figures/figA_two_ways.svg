<text x="40.0" y="314.0" font-size="11.0" font-weight="400" fill="#111827" text-anchor="start">If the judge picks A, B or C here, that is a</text>
<text x="40.0" y="331.0" font-size="11.5" font-weight="700" fill="#D55E00" text-anchor="start">wrong pick.</text>
<text x="116.0" y="331.0" font-size="11.0" font-weight="400" fill="#111827" text-anchor="start">Only NONE is correct.</text>
