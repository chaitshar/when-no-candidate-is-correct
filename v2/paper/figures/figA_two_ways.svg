<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372">
<style>text { font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif; }</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/></marker></defs>
<rect x="0" y="0" width="900" height="372" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-size="14.5" font-weight="700" fill="#111827" text-anchor="start">Two ways to ask the judge</text>
<text x="24.0" y="44.0" font-size="10.5" font-weight="400" fill="#6B7280" text-anchor="start">Example pool: three answers to one problem, and all three are wrong (red cross). The best reply is NONE.</text>
<rect x="24.0" y="58.0" width="414.0" height="290.0" rx="6.0" fill="#F9FAFB" fill-opacity="1.00" stroke="#E5E7EB" stroke-width="1.0"/>
