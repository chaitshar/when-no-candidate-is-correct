const AUDIT_DATA = {"meta": {"tool": "C3 V2 Human Audit Tool (Blinded)", "seed_section_a": 2026, "counts": {"section_a": 50, "section_b": 22, "section_c": 20, "total": 92}}, "section_a": [{"item_id": "A_01_arxivmath-0626_20", "pid": "arxivmath-0626_20", "comp": "arxivmath-0626", "problem": "Let $G = (V,E)$ be an edge-colored graph, and let $\\delta^c(G) = \\min_{v \\in V} d^c(v)$ where $d^c(v)$ is the number of colors on edges incident to a vertex $v$. For a sufficiently large integer $n$, if $G$ is an edge-colored triangle-free graph of order $n$ that satisfies $\\delta^c(G) \\geq f(n)$, then $G$ is guaranteed to contain a rainbow cycle of length four. Assuming $f(n)$ is a function of the form $\\frac{n+a}{b}$ for integers $a$ and $b$, and that this bound is the best possible, what is the exact expression for $f(n)$?\n", "official_answer": "\\frac{n+7}{5}", "candidates": [{"index": 1, "answer": "f(n)=\\frac{n+1}{3}", "tail_reasoning": "...e-colored triangle-free graphs\" hmm. Let me recall: Ding, Hu, Wang, Yang? \"Properly colored C4's in edge-colored graphs\" gives δ^c ≥ (n+1)/2... For rainbow C4 in triangle-free graphs, I recall the bound δ^c(G) ≥ (n+1)/3, and best possible — yes, \"Color degree and rainbow C4 in triangle-free graphs\" I think showed δ^c(G) ≥ (n+1)/3 suffices for large n, and this is sharp.\n\n\\boxed{f(n)=\\frac{n+1}{3}}"}, {"index": 2, "answer": "f(n)=\\dfrac{n+6}{5}", "tail_reasoning": "...h tiny color degree, and the cyclic $C_5$ structure is the unique way to avoid this; it caps the minimum color degree at $\\lfloor n/5\\rfloor + 1$. Hence for sufficiently large $n$,\n$$\\delta^c(G)\\ \\geq\\ \\frac{n+6}{5}\\quad\\Longrightarrow\\quad G \\text{ contains a rainbow } C_4,$$\nand by the construction (exactly matching at $n \\equiv 4 \\pmod 5$) this is best possible.\n\n$$\\boxed{f(n)=\\dfrac{n+6}{5}}$$"}, {"index": 3, "answer": "f(n)=\\frac{n+5}{3}", "tail_reasoning": "...‑coloured graph on $n\\ge n_0$ vertices in which every vertex is incident with at least $(n+5)/3$ distinctly coloured edges contains a rainbow $C_\\ell$; for $\\ell=4$ (indeed for all $\\ell\\not\\equiv 0 \\pmod 3$) the construction above shows the bound is best possible. (This sharpens the earlier Čada–Kaneko–Ryjáček–Yoshimoto bound $\\delta^c(G)>n/3+1$ for rainbow $C_4$.)\n\n$$\\boxed{f(n)=\\frac{n+5}{3}}$$"}]}, {"item_id": "A_02_arxivmath-0426_28", "pid": "arxivmath-0426_28", "comp": "arxivmath-0426", "problem": "A skew morphism of a finite group $B$ is a permutation $\\varphi$ of $B$ fixing the identity and satisfying $\\varphi(xy) = \\varphi(x)\\varphi^{i_x}(y)$ for some integers $i_x$ indexed by $x \\in B$. Let $\\mathrm{Skew}(n)$ denote the number of skew morphisms of the cyclic group $\\mathbb{Z}_n$. What is the exact formula for $\\mathrm{Skew}(2^e)$ as a function of $e$, for any integer $e \\geq 3$?\n", "official_answer": "\\frac{7 \\cdot 4^{e-2} + 8}{6}", "candidates": [{"index": 1, "answer": "2^{2e-3}+2^{e-2}", "tail_reasoning": "The number of skew morphisms of the cyclic group \\(\\mathbb{Z}_n\\) for \\(n=2^e\\) with \\(e\\ge 3\\) is known to be  \n\\[\n\\operatorname{Skew}(2^e) = 2^{2e-3} + 2^{e-2}.\n\\]  \nThis can also be written as \\(2^{e-2}(2^{e-1}+1)\\) or \\(\\frac{2^{e-1}(2^{e-1}+1)}{2}\\).  \nThus the exact formula for \\(e\\ge 3\\) is  \n\\[\n\\boxed{2^{2e-3}+2^{e-2}}.\n\\]"}, {"index": 2, "answer": "2^{e-2}(e+1)", "tail_reasoning": "The number of skew morphisms of the cyclic group \\(\\mathbb{Z}_{2^e}\\) for \\(e \\ge 3\\) is known from the classification of skew morphisms of cyclic groups. According to results by M. Conder, R. Jajcay, and T. Tucker (see \"The number of skew morphisms of cyclic groups\"), the exact formula is\n\\[\n\\mathrm{Skew}(2^e) = 2^{e-2}(e+1).\n\\]\n\n\\boxed{2^{e-2}(e+1)}"}, {"index": 3, "answer": "2^{e}-2", "tail_reasoning": "... $2^e$ (there are $2^{e-1}$ such maps).  \n\nThese two families intersect exactly when $\\varphi_t$ is also an automorphism, which occurs for $t=0$ (the identity ]_0^{2\\pi} \\right]$$\n$$P = 2 \\left[ (2\\pi - 0) + (\\sin(2\\pi) - \\sin(0)) \\right]$$\n$$P = 2 \\left[ 2\\pi + (0 - 0) \\right]$$\n$$P = 2(2\\pi) = 4\\pi$$\n\nThe perimeter of the region $R$ is $4\\pi$."}]}, {"item_id": "A_04_arxivmath-0226_14", "pid": "arxivmath-0226_14", "comp": "arxivmath-0226", "problem": "Let $X$ be a Banach space. For $d \\in (0,2]$ and $a>0$, define the modulus of uniform property $(S)$ for $X$ as\n$$ U_X(d;a) = \\inf \\left\\{ \\sup_{\\|z\\|\\le a} (\\|x+z\\|-\\|y+z\\|) : x,y\\in X, \\|x\\|=\\|y\\|=1, \\|x-y\\|\\ge d \\right\\}. $$\nWhat is the exact expression for $U_{L_1(\\mu)}(d;a)$ as a function of $d$ and $a$, where $\\mu$ is an atomless measure? Express the minimum of two values $x$ and $y$ as $\\min(x, y)$.\n", "official_answer": "\\min(\\frac{4a}{2+d}, 1) \\cdot d", "candidates": [{"index": 1, "answer": "U_{L_1(\\mu)}(d;\\,a) \\;=\\; d\\,\\min(a,\\,1)", "tail_reasoning": "...ts first, increasing gain for small $a$.\n\n**Pairs with $\\|x-y\\|=d'>d$** yield minimum sup $d'\\min(a,1) > d\\min(a,1)$, so the infimum occurs at $\\|x-y\\|=d$.\n\n**Explicit optimal pair** (on $[0,1]$):\n$$x = 1,\\qquad y = \\tfrac{2}{2-d}\\cdot\\mathbf{1}_{[0,\\,1-d/2]}$$\nachieves $\\|x\\|=\\|y\\|=1$, $\\|x-y\\|=d$, and supremum exactly $d\\min(a,1)$.\n\n## Result\n\n$$\\boxed{U_{L_1(\\mu)}(d;\\,a) \\;=\\; d\\,\\min(a,\\,1)}$$"}, {"index": 2, "answer": "\\min(ad, d)", "tail_reasoning": "....) confirms no improvement:\n$$\\sup_{\\|z\\|\\leq a}(\\|x+z\\|-\\|y+z\\|) = \\min(ad, d)$$\n\n## Verification Example\n\nFor $a=1/2, d=1$: Take $z = -\\mathbf{1}_{[0,1/2]}$, $\\|z\\|=1/2$.\n- $y+z$: 0 on $[0,1/2]$, 1 on $[1/2,1]$, so $\\|y+z\\|=1/2$\n- $x+z$: $-1/2$ on $[0,1/2]$, $1/2$ on $[1/2,1]$, 1 on $[2,2.5]$, so $\\|x+z\\|=1$\n- $D = 1 - 1/2 = 1/2 = ad$ ✓\n\n## Conclusion\n\n$$U_{L_1(\\mu)}(d;a) = \\boxed{\\min(ad, d)}$$"}, {"index": 3, "answer": "\\min(d, ad)", "tail_reasoning": "...e sup $\\geq \\min(d, 2a) \\geq ad$ for $d \\leq 2$.\n\n## Saturation at Large $a$\n\nFor $a \\geq 1$: take $z = -y$ (with $\\|z\\| = 1 \\leq a$):\n$$\\|x+z\\| - \\|y+z\\| = \\|x-y\\| - 0 = d$$\n\nThis saturates the triangle inequality bound.\n\n## Conclusion\n\nCombining all cases:\n- For $a \\leq 1$: $U_{L_1(\\mu)}(d;a) = ad$\n- For $a \\geq 1$: $U_{L_1(\\mu)}(d;a) = d$\n\nTherefore:\n\n$$U_{L_1(\\mu)}(d;a) = \\boxed{\\min(d, ad)}$$"}]}, {"item_id": "A_05_arxivmath-0526_1", "pid": "arxivmath-0526_1", "comp": "arxivmath-0526", "problem": "Let $m$ be a fixed positive integer. For each integer $n > m$, let $\\lambda_n \\vdash n$ be a partition that is either a hook shape or a two-row shape, such that the sum of all parts of $\\lambda_n$ excluding its largest part is exactly equal to $m$. Let $\\sigma_n \\in S_n$ be a uniformly random permutation chosen from the set of all permutations whose Robinson-Schensted shape is $\\lambda_n$. As $n \\to \\infty$, what is the limiting value of the expected proportion of fixed points in $\\sigma_n$?\n", "official_answer": "\\frac{(2m)!!}{(2m+1)!!}", "candidates": [{"index": 1, "answer": "\\dfrac{4^m\\,(m!)^2}{(2m+1)!}", "tail_reasoning": "...{k}\\binom{2m-2k}{m-k}.$$\nUsing the identity $\\sum_k\\binom{2k}{k}\\binom{2m-2k}{m-k}=4^m$, the integral equals $\\dfrac{4^m(m!)^2}{(2m+1)!}$.\n\n**Check for $m=1$.** Direct counting of the $(n-1)^2$ permutations of shape $(n-1,1)$ gives\n$$\\mathbb E[\\operatorname{fix}]=\\frac{(n-2)(2n-3)}{3(n-1)},$$\nso the proportion tends to $2/3$, which agrees with the formula.\n\n$$\\boxed{\\dfrac{4^m\\,(m!)^2}{(2m+1)!}}$$"}, {"index": 2, "answer": "\\dfrac{2}{3}", "tail_reasoning": "...ctly the interval cycles $(i\\ i{+}1\\cdots j)^{\\pm1}$; the number of fixed points is $n-(|j-i|+1)$, and averaging over the $(n-1)^2$ such permutations gives $n-\\tfrac{n}{3}+O(1)$, i.e. proportion $\\to 1-\\tfrac13$.\n\nThe same computation carried out under the hook / two‑row conditioning yields the limit\n\n$$\\lim_{n\\to\\infty}\\frac{\\mathbb E[\\#\\text{fixed points of }\\sigma_n]}{n}=\ inom{q}{2}$ bowties, so the total is $\\lfloor n/2\\rfloor\\binom{q}{2}$.\n\nANSWER: $\\lfloor n/2\\rfloor\\binom{q}{2}$"}, {"item_id": "B_04_haiku__SOLVE__arxivmath-0126_9__1", "solve_id": "haiku__SOLVE__arxivmath-0126_9__1", "pid": "arxivmath-0126_9", "attempt": "1", "comp": "arxivmath-0126", "problem": "A \\emph{bowtie} is a graph consisting of two triangles sharing exactly one common vertex. Let \\(T_{n,2}=K_{\\lceil n/2\\rceil,\\lfloor n/2\\rfloor}\\) be the balanced complete bipartite graph on \\(n\\) vertices. For integers \\(n\\) and \\(q\\), define \\(K_{\\lceil n/2\\rceil,\\lfloor n/2\\rfloor}^q\\) to be the graph obtained from \\(T_{n,2}\\) by adding \\(q\\) pairwise vertex-disjoint edges inside the part of size \\(\\lceil n/2\\rceil\\). Let \\(\\lambda(G)\\) denote the spectral radius of a graph \\(G\\). Assuming \\(n\\) is sufficiently large and \\(2\\le q\\le \\delta\\sqrt n\\) for some absolute constant \\(\\delta>0\\), what is the smallest number of (not necessarily induced) bowties that must be contained in any \\(n\\)-vertex graph \\(G\\) satisfying \\(\\lambda(G)\\ge \\lambda\\bigl(K_{\\lceil n/2\\rceil,\\lfloor n/2\\rfloor}^q\\bigr)\\)?\n", "official_answer": "\\binom{q}{2}\\left\\lfloor\\frac{n}{2}\\right\\rfloor", "extracted_answer": "\\lfloor n/2\\rfloor\\binom{q}{2}", "tail_reply": "...e_i \\cup \\{w\\}$ with $w\\in B$, giving $q\\lfloor n/2\\rfloor$ triangles.\n\n**Bowties.** Two triangles $e_i\\cup\\{w\\}$ and $e_j\\cup\\{w'\\}$ share exactly one vertex only in one way:\n- If $w = w'$, the triangles share only $w$ when $i\\ne j$, since $e_i$ and $e_j$ are disjoint. This gives $\\lfloor n/2\\rfloor\\binom{q}{2}$ bowties.\n- If $w\\ne w'$, the only possible shared vertex would lie in $A$, which forces $i=j$ and shares two vertices. No bowties arise here.\n\nHence $K^q_{\\lceil n/2\\rceil,\\lfloor n/2\\rfloor}$ contains $\\lfloor n/2\\rfloor\\binom{q}{2}$ bowties.\n\nANSWER: $\\lfloor n/2\\rfloor\\binom{q}{2}$"}, {"item_id": "B_05_haiku__SOLVE__arxivmath-0226_27__0", "solve_id": "haiku__SOLVE__arxivmath-0226_27__0", "pid": "arxivmath-0226_27", "attempt": "0", "comp": "arxivmath-0226", "problem": "Let $\\Omega \\subset \\mathbb{R}^2$ be a bounded open set, and let $w$ be a positive continuous function on $\\overline{\\Omega}$ such that $\\Delta \\log w$ is equal to a constant $C$ on $\\Omega$. The weighted logarithmic potential operator on $L^2(\\Omega)$ is defined as\n$$ \\mathcal{L}_{w} u(x) = \\int_{\\Omega} \\log\\left(\\frac{w(x)w(y)}{|x-y|}\\right) u(y) \\, dy $$\nIf $0$ is an eigenvalue of $\\mathcal{L}_{w}$, what is the necessary value of the constant $C$?\n", "official_answer": "\\frac{2\\pi}{|\\Omega|}", "extracted_answer": "C = \\dfrac{2\\pi}{|\\Omega|}", "tail_reply": "...right side gives $\\Delta(Af + B) = AC$. Hence\n$$u = \\frac{AC}{2\\pi} \\quad \\text{a.e. on } \\Omega,$$\nso $u$ is a constant $c$.\n\nNow impose consistency with the definition of $A$: $A = \\int_\\Omega u = c|\\Omega|$, and $c = \\dfrac{AC}{2\\pi} = \\dfrac{c|\\Omega| C}{2\\pi}$.\n\nIf $c = 0$, then $u = 0$, which is excluded. So $c \\neq 0$, and dividing by $c$ gives $|\\Omega|\\,C = 2\\pi$.\n\nThis is a necessary condition. The eigenfunction is $u \\equiv$ const, and one still needs $V - Af$ to be constant on $\\Omega$, which constrains $w$ but does not change the value of $C$.\n\nANSWER: $C = \\dfrac{2\\pi}{|\\Omega|}$"}, {"item_id": "B_06_haiku__SOLVE__arxivmath-0226_27__1", "solve_id": "haiku__SOLVE__arxivmath-0226_27__1", "pid": "arxivmath-0226_27", "attempt": "1", "comp": "arxivmath-0226", "problem": "Let $\\Omega \\subset \\mathbb{R}^2$ be a bounded open set, and let $w$ be a positive continuous function on $\\overline{\\Omega}$ such that $\\Delta \\log w$ is equal to a constant $C$ on $\\Omega$. The weighted logarithmic potential operator on $L^2(\\Omega)$ is defined as\n$$ \\mathcal{L}_{w} u(x) = \\int_{\\Omega} \\log\\left(\\frac{w(x)w(y)}{|x-y|}\\right) u(y) \\, dy $$\nIf $0$ is an eigenvalue of $\\mathcal{L}_{w}$, what is the necessary value of the constant $C$?\n", "official_answer": "\\frac{2\\pi}{|\\Omega|}", "extracted_answer": "C = \\dfrac{2\\pi}{|\\Omega|}", "tail_reply": "...a$ (distributionally). Applying $\\Delta$ to the identity and using $\\Delta \\log w = C$ on $\\Omega$ gives\n\n$$2\\pi u = mC \\quad \\text{on } \\Omega.$$\n\nSo $u$ is a constant $c = mC/(2\\pi)$.\n\n- If $m = 0$, then $u = 0$, which contradicts $u \\neq 0$. Hence $m \\neq 0$.\n- Since $m = \\int_\\Omega u = c\\,|\\Omega|$ and $c = mC/(2\\pi)$, we get $m = \\dfrac{mC|\\Omega|}{2\\pi}$. Dividing by $m \\neq 0$ gives $C|\\Omega| = 2\\pi$.\n\nTherefore any zero eigenvalue forces $C = 2\\pi/|\\Omega|$. This is a necessary condition; the argument does not show it is sufficient for every $w$.\n\nANSWER: $C = \\dfrac{2\\pi}{|\\Omega|}$"}, {"item_id": "B_07_haiku__SOLVE__arxivmath-0326_13__1", "solve_id": "haiku__SOLVE__arxivmath-0326_13__1", "pid": "arxivmath-0326_13", "attempt": "1", "comp": "arxivmath-0326", "problem": "Let $h(t,x)$ be the solution to the (1+1)-dimensional Kardar-Parisi-Zhang (KPZ) equation with flat initial profile. Let $Z(t,x)$ be the solution to the corresponding stochastic heat equation with flat initial condition. Define $\\kappa = \\big(\\mathbb{E}[Z(t,0)^{-1}]\\big)^2$. Evaluate the limit \n$$ \\lim_{|x|\\to\\infty} \\frac{\\mathrm{Cov}[h(t,x),h(t,0)]}{|x|^{-2}\\exp\\left(-\\frac{x^2}{4t}\\right)} $$\nexpressed in terms of $\\kappa$ and $t$.\n", "official_answer": "\\frac{2\\kappa}{\\sqrt{\\pi}}t^{3/2}", "extracted_answer": "\\dfrac{2\\kappa\\, t^{3/2}}{\\sqrt{\\pi}}", "tail_reply": "... two fields are weakly coupled through the shared rare meeting event. Linearizing $\\log$ around each $Z$ (derivative $1/z$) gives\n$$\\mathrm{Cov}(\\log Z(t,x),\\log Z(t,0))\\approx \\mathbb{E}[Z(t,x)^{-1}]\\,\\mathbb{E}[Z(t,0)^{-1}]\\,\\mathrm{Cov}(Z(t,x),Z(t,0)).$$\nBy translation invariance both factors equal $\\mathbb{E}[Z(t,0)^{-1}]$, so the prefactor is $\\kappa$. This is the step I _\\mu$ and $u_\\mu$ denote the Madelung--Bohm velocities. The associated quantum Fisher metric $g_{\\mu\\nu}^{\\mathrm{FS}}$ evaluated with respect to the physical probability density $\\mathcal{P}$ takes the exact form $g_{\\mu\\nu}^{\\mathrm{FS}} = C \\bigl[\\operatorname{Cov}(\\pi_\\mu,\\pi_\\nu) + \\operatorname{Cov}(u_\\mu,u_\\nu)\\bigr]_{\\mathcal{P}}$. What is the explicit mathematical expression for the proportionality factor $C$ in terms of the particle mass $m$ and the reduced Planck constant $\\hbar$? Use $x = \\hbar$ in your answer for better parseability. Do not use $\\hbar$.\n", "official_answer": "\\frac{4m^2}{x^2}", "extracted_answer": "C = \\dfrac{4m^2}{x^2}", "tail_reply": "...partial\\sqrt{\\mathcal{P}} = \\tfrac12\\sqrt{\\mathcal{P}}\\,\\partial\\ln\\mathcal{P}$ together with $\\mathbb{E}[\\partial\\ln\\mathcal{P}] = 0$:\n$$g^{\\mathrm{FS}}_{\\mu\\nu} = \\operatorname{Cov}(\\partial_\\mu\\ln\\mathcal{P},\\partial_\\nu\\ln\\mathcal{P}) + 4\\operatorname{Cov}\\!\\left(\\frac{\\partial_\\mu S}{\\hbar},\\frac{\\partial_\\nu S}{\\hbar}\\right).$$\n\n5. Substituting $\\partial_\\mu S = m\\pi_\\mu$ and $\\partial_\\mu\\ln\\mathcal{P} = 2m\\,u_\\mu/\\hbar$:\n$$g^{\\mathrm{FS}}_{\\mu\\nu} = \\frac{4m^2}{\\hbar^2}\\left[\\operatorname{Cov}(\\pi_\\mu,\\pi_\\nu) + \\operatorname{Cov}(u_\\mu,u_\\nu)\\right].$$\n\nANSWER: $C = \\dfrac{4m^2}{x^2}$"}, {"item_id": "B_10_haiku__SOLVE__arxivmath-0426_23__0", "solve_id": "haiku__SOLVE__arxivmath-0426_23__0", "pid": "arxivmath-0426_23", "attempt": "0", "comp": "arxivmath-0426", "problem": "Let $F$ be a finite field of characteristic $p$, and let $\\alpha_1, \\dots, \\alpha_r$ be distinct elements in $F$. Consider the Hyperderivative Reed-Solomon (HRS) code $C = HRS_{t}(\\{\\alpha_{1},\\dots,\\alpha_{r}\\},s)$ over $F$, which has length $rs$ and dimension $t$. Assuming the parameters satisfy $p\\geq t\\geq 2s$ and $t\\leq \\frac{r+2s-1}{2}$, what is the exact dimension of the Schur square of $C$?\n", "official_answer": "(2t-2s+1)s", "extracted_answer": "s(2t-2s+1)", "tail_reply": "...}m(k)=s(t-s+1)$ and $m(t-1)=s$, so\n$$\\dim S = 2s(t-s+1)-s = 2st-2s^2+s = s(2t-2s+1).$$\n\n**Consistency checks.**\n- For $s=1$ this gives $2t-1$, the known dimension of the Schur square of a GRS code.\n- $\\dim S\\le rs$ is equivalent to $t\\le\\frac{r+2s-1}{2}$, which is exactly the hypothesis. So the hypothesis is what makes the answer fit inside the ambient space of dimension $rs$.\n\nThe map from $S$ to the $rs$ evaluation coordinates is taken to be injective under these hypotheses, which I did not prove. Under that assumption, the dimension of the Schur square is $s(2t-2s+1)$.\n\nANSWER: $s(2t-2s+1)$"}, {"item_id": "B_11_haiku__SOLVE__arxivmath-0426_23__1", "solve_id": "haiku__SOLVE__arxivmath-0426_23__1", "pid": "arxivmath-0426_23", "attempt": "1", "comp": "arxivmath-0426", "problem": "Let $F$ be a finite field of characteristic $p$, and let $\\alpha_1, \\dots, \\alpha_r$ be distinct elements in $F$. Consider the Hyperderivative Reed-Solomon (HRS) code $C = HRS_{t}(\\{\\alpha_{1},\\dots,\\alpha_{r}\\},s)$ over $F$, which has length $rs$ and dimension $t$. Assuming the parameters satisfy $p\\geq t\\geq 2s$ and $t\\leq \\frac{r+2s-1}{2}$, what is the exact dimension of the Schur square of $C$?\n", "official_answer": "(2t-2s+1)s", "extracted_answer": "s(2t-2s+1)", "tail_reply": "...; for $s=2$ it gives $4t-6$, which matches both $t=4$ and $t=5$. I did not derive the general rank argument, so this formula is inferred from these cases and is not proven here.\n\n**Consistency checks.**\n- At $t=2s$ the formula gives $s(2s+1)=\\binom{t+1}{2}$, the total number of pairs $(j,k)$. This is consistent with the hypothesis $t\\ge 2s$.\n- The hypothesis $t\\le\\frac{r+2s-1}{2}$ is equivalent to $r\\ge 2t-2s+1$, so each of the $s$ blocks has enough evaluation points to be faithful. Then the dimension is $s(2t-2s+1)\\le rs$, so the formula is not capped by the code length.\n\nANSWER: $s(2t-2s+1)$"}, {"item_id": "B_12_haiku__SOLVE__arxivmath-0426_30__0", "solve_id": "haiku__SOLVE__arxivmath-0426_30__0", "pid": "arxivmath-0426_30", "attempt": "0", "comp": "arxivmath-0426", "problem": "Let $k \\ge 3$ and $n \\ge 3k+2$. Among all $(k+1)$-edge-connected simple graphs $G$ on $n$ vertices with spanning tree packing number $\\tau(G) < k$, there is a unique graph $F_{n,k}$ that maximizes the adjacency matrix spectral radius. What is the total number of edges in $F_{n,k}$ as a function of $n$ and $k$?\n", "official_answer": "\\binom{n-4}{2} + 4k - 1", "extracted_answer": "\\dfrac{(n-3)(n-6)}{2}+4k", "tail_reply": "...is is attainable with all degrees at least $k+1$ (for example, $K_4$ on $S$ plus $4k-7$ edges to $A$, distributed so each $S$-vertex has degree at least $k+1$).\n\n**4. Why this is the spectral extremal.** Concentrating the non-edges on four low-degree vertices keeps a clique of size $n-4$, which gives spectral radius about $n-5$. Spreading the non-edges, or using $s\\ge5$, gives a smaller value. The comparison with $s=5$ reduces to $n>k+5$, which holds since $n\\ge 3k+2$.\n\n**Check.** For $k=3$, $n=11$: $\\binom{7}{2}+11=32$, and $(n-3)(n-6)/2+4k = 20+12 = 32$. ✓\n\nANSWER: $\\dfrac{(n-3)(n-6)}{2}+4k$"}, {"item_id": "B_13_haiku__SOLVE__arxivmath-0426_30__1", "solve_id": "haiku__SOLVE__arxivmath-0426_30__1", "pid": "arxivmath-0426_30", "attempt": "1", "comp": "arxivmath-0426", "problem": "Let $k \\ge 3$ and $n \\ge 3k+2$. Among all $(k+1)$-edge-connected simple graphs $G$ on $n$ vertices with spanning tree packing number $\\tau(G) < k$, there is a unique graph $F_{n,k}$ that maximizes the adjacency matrix spectral radius. What is the total number of edges in $F_{n,k}$ as a function of $n$ and $k$?\n", "official_answer": "\\binom{n-4}{2} + 4k - 1", "extracted_answer": "\\frac{(n-3)(n-6)}{2}+4k", "tail_reply": "...edges. Since $n\\ge 3k+2$, the loss dominates, so $m=4$ is optimal.\n\n**Construction for $m=4$.** Let $A=K_{n-4}$ and let $S$ be four vertices with $e(S)=5$ (a $K_4$ minus an edge) and $e(S,A)=4k-6$. Each $S$-vertex has degree $\\ge k+1$, and the crossing count is $4k-1$. Then $\\tau(G)=\\lfloor (4k-1)/4\\rfloor = k-1<k$, and the cut conditions for $(k+1)$-edge-connectivity hold for $k\\ge 3$.\n\n**Edge count.**\n$$\\binom{n-4}{2}+(4k-1)=\\frac{(n-4)(n-5)}{2}+4k-1=\\frac{(n-3)(n-6)}{2}+4k.$$\n\nCheck: $k=3$, $n=11$ gives $\\binom{7}{2}+11=32$, and $\\frac{8\\cdot 5}{2}+12=32$.\n\nANSWER: $\\frac{(n-3)(n-6)}{2}+4k$"}, {"item_id": "B_14_haiku__SOLVE__arxivmath-0426_36__0", "solve_id": "haiku__SOLVE__arxivmath-0426_36__0", "pid": "arxivmath-0426_36", "attempt": "0", "comp": "arxivmath-0426", "problem": "Consider the null-recurrent dynamic process $dX_t = \\sigma(X_t)dW_t$, where $W$ is a standard Brownian motion and $\\sigma(x) = \\alpha \\mathbb{1}\\{x < \\rho\\} + \\beta \\mathbb{1}\\{x \\geq \\rho\\}$ for unknown positive volatility levels $\\alpha, \\beta$. Suppose we observe the process at discrete times $t_k = k\\Delta$ for $k=0,1,\\dots,n$, where the sampling step is $\\Delta = n^{-\\gamma}$ with $\\gamma \\in [0,1)$. The estimation error of the profile maximum likelihood estimator for the threshold parameter $\\rho$ converges at a minimax optimal rate proportional to $n^p$. What is the exponent $p$ as a function of $\\gamma$?\n", "official_answer": "-(1+\\gamma)/2", "extracted_answer": "p = -\\frac{1+\\gamma}{2}", "tail_reply": "...a^2$ is fixed regardless of $\\Delta$.\n5. **Balance.** The threshold is localized to within $\\varepsilon$ when the number of informative observations is of order one: $n^{(1+\\gamma)/2}\\varepsilon \\asymp 1$, which gives $\\varepsilon \\asymp n^{-(1+\\gamma)/2}$.\n\n**Sanity checks:**\n- At $\\gamma = 0$ (fixed step, $\\Delta = 1$), the rate is $n^{-1/2}$, consistent with the $\\sqrt{n}$ local-time scaling.\n- As $\\gamma \\to 1$ (time horizon $T \\to 1$, $\\Delta = 1/n$), the rate approaches $n^{-1}$, matching the known continuous-observation rate for a volatility threshold.\n\nANSWER: $p = -\\frac{1+\\gamma}{2}$"}, {"item_id": "B_15_haiku__SOLVE__arxivmath-0426_5__1", "solve_id": "haiku__SOLVE__arxivmath-0426_5__1", "pid": "arxivmath-0426_5", "attempt": "1", "comp": "arxivmath-0426", "problem": "Let $C$ be an $(n, q^k, d)_q$ code with integer dimension $k \\ge 2$ and Singleton defect $s = n - k + 1 - d$. The code is called length-maximal if its length attains the bound $n = (s+1)(q+1) + k - 2$. It is proven that for such a length-maximal code, the parameter $s$ must satisfy a divisibility condition of the form $(s+2) \\mid P(q)$, where $P(q)$ is a monic polynomial in $q$ of degree 2. What is the polynomial $P(q)$?\n", "official_answer": "q(q+1)", "extracted_answer": "q^2 + q", "tail_reply": "...ly r points, so the multiset is a set S with every line meeting it in 0 or r points.\n\n**Step 2: count secant lines.** Each point of S lies on q+1 lines, each containing r = t+1 points of S. Counting incidences gives n(q+1) = L(t+1), where L is the number of lines meeting S. So (t+1) divides n(q+1).\n\n**Step 3: reduce modulo t+1.** Since t ≡ -1 (mod t+1), we have n = tq+t+1 ≡ -q. Hence (t+1) divides q(q+1), i.e. (s+2) | (q² + q).\n\nThis derivation is for k = 3. I did not check the general-k statement from the literature; the degree-2 monic form in the problem matches this result.\n\nANSWER: q^2 + q"}, {"item_id": "B_16_haiku__SOLVE__arxivmath-0526_23__1", "solve_id": "haiku__SOLVE__arxivmath-0526_23__1", "pid": "arxivmath-0526_23", "attempt": "1", "comp": "arxivmath-0526", "problem": "For an integer $q\\ge 2$ and a graph $F$ with $q\\mid e(F)$, let $R(F,\\mathbb{Z}_q)$ be the least integer $n$ such that every edge-labeling $w\\colon E(K_n)\\to \\mathbb{Z}_q$ contains a copy of $F$ whose edge-label sum is zero in $\\mathbb{Z}_q$. Let $C_m$ denote the cycle graph on $m$ vertices. For any fixed odd integer $q \\ge 3$ and every integer $k \\ge 35q$, what is the exact value of $R(C_{qk}, \\mathbb{Z}_q)$?\n", "official_answer": "q(k+1)-1", "extracted_answer": "qk+q-1", "tail_reply": "... Take $n=qk$ vertices and fix a vertex $v$. Label every edge at $v$ with $1$ and every other edge with $0$.\n\n- A cycle through $v$ uses exactly two edges at $v$, so its sum is $2 \\bmod q$. Since $q$ is odd, $q\\nmid 2$, so it is not zero-sum.\n- A cycle avoiding $v$ would need $qk$ vertices among the remaining $qk-1$, which is impossible.\n\nSo this labeling of $K_{qk}$ has no zero-sum $C_{qk}$, giving $R(C_{qk},\\mathbb{Z}_q)\\ge qk+1$. That is weaker than the claimed value $qk+q-1$, so the stronger lower bound must come from a more refined construction that I did not reconstruct.\n\nANSWER: $qk+q-1$"}, {"item_id": "B_17_haiku__SOLVE__arxivmath-0526_37__0", "solve_id": "haiku__SOLVE__arxivmath-0526_37__0", "pid": "arxivmath-0526_37", "attempt": "0", "comp": "arxivmath-0526", "problem": "Let $d \\ge 2$ be an integer, and let $k \\ge 1$ be a fixed integer. Let $G$ be a graph drawn uniformly at random from the set of all $k$-regular graphs on $n$ vertices (assuming $kn$ is even). As $n \\to \\infty$, the generic $d$-rigidity rank of $G$ is asymptotically almost surely equal to $C n + o(n)$, where $C$ is a constant depending only on $k$ and $d$. What is the expression for $C$ in terms of $k$ and $d$?\n", "official_answer": "\\min(k/2,d)", "extracted_answer": "\\min\\{k/2,\\ d\\}", "tail_reply": "...ost $k/2$. The sparsity constraint $e(H) \\le d|V(H)|$ is therefore automatically satisfied when $k \\le 2d$, and then the rank is $kn/2 - o(n)$.\n\n**Case split.**\n- If $k \\le 2d$, the rank is $\\approx kn/2$, so $C = k/2$.\n- If $k > 2d$, the whole-graph count $dn - \\binom{d+1}{2}$ is the binding constraint, and the expander structure supplies enough independent edges to reach it, so $C = d$.\n\nBoth cases agree at $k = 2d$, where $k/2 = d$. As a sanity check, for $k=1$ the graph is a perfect matching, all $n/2$ edges are independent, and $C = 1/2$ as the formula predicts.\n\nANSWER: $\\min\\{k/2,\\ d\\}$"}, {"item_id": "B_18_haiku__SOLVE__arxivmath-0526_37__1", "solve_id": "haiku__SOLVE__arxivmath-0526_37__1", "pid": "arxivmath-0526_37", "attempt": "1", "comp": "arxivmath-0526", "problem": "Let $d \\ge 2$ be an integer, and let $k \\ge 1$ be a fixed integer. Let $G$ be a graph drawn uniformly at random from the set of all $k$-regular graphs on $n$ vertices (assuming $kn$ is even). As $n \\to \\infty$, the generic $d$-rigidity rank of $G$ is asymptotically almost surely equal to $C n + o(n)$, where $C$ is a constant depending only on $k$ and $d$. What is the expression for $C$ in terms of $k$ and $d$?\n", "official_answer": "\\min(k/2,d)", "extracted_answer": "C=\\min\\left(\\frac{k}{2},\\, d\\right)", "tail_reply": "...ependent except for $o(n)$ dependencies. Dependencies come from dense small subgraphs, of which a random $k$-regular graph has only $O(1)$ copies. Linear-size subgraphs $S$ satisfy $e(S) \\le k|S|/2 \\le d|S|$, so they cause no dependencies. The rank is therefore $kn/2 + o(n)$.\n- **Case $k \\ge 2d$:** The random graph is generically rigid, so the rank is $dn - \\binom{d+1}{2} = dn + o(n)$.\n\nCombining the two cases gives $C = \\min\\{k/2,\\ d\\}$. This is a heuristic argument; I did not verify it against the literature on rigidity of random regular graphs.\n\nANSWER: $C=\\min\\left(\\frac{k}{2},\\, d\\right)$"}, {"item_id": "B_19_haiku__SOLVE__arxivmath-0526_4__0", "solve_id": "haiku__SOLVE__arxivmath-0526_4__0", "pid": "arxivmath-0526_4", "attempt": "0", "comp": "arxivmath-0526", "problem": "Let $n \\ge 3$ and let $\\mathbb{O}_n$ be the minimal nilpotent orbit in $\\mathfrak{sl}_n$. The affine closure of its cotangent bundle, $\\overline{T^*\\mathbb{O}_n}^{\\mathrm{aff}}$, is isomorphic to a $\\mathbb{C}^*$-Hamiltonian reduction of the minimal nilpotent orbit closure in the orthogonal Lie algebra $\\mathfrak{so}_m$. What is $m$ as a function of $n$?\n", "official_answer": "2n+2", "extracted_answer": "m = 2n+2", "tail_reply": "... 4n-4$. The affine closure has the same dimension.\n- For $\\mathfrak{so}_m$ with $m \\ge 7$, $h^\\vee = m-2$, so the minimal nilpotent orbit closure has dimension $2(m-2)-2 = 2m-6$.\n- A $\\mathbb{C}^*$-Hamiltonian reduction lowers dimension by $2$, giving $2m-8$.\n\nSetting $2m-8 = 4n-4$ gives $m = 2n+2$.\n\nAs a check, $n=3$ gives $\\mathfrak{so}_8$: the minimal orbit has dimension $10$, and reducing by $\\mathbb{C}^*$ gives dimension $8 = \\dim T^*\\mathbb{O}_3$. I did not verify the isomorphism itself, only the dimension match, which is consistent with $m$ being uniquely determined.\n\nANSWER: $m = 2n+2$"}, {"item_id": "B_20_haiku__SOLVE__arxivmath-0526_4__1", "solve_id": "haiku__SOLVE__arxivmath-0526_4__1", "pid": "arxivmath-0526_4", "attempt": "1", "comp": "arxivmath-0526", "problem": "Let $n \\ge 3$ and let $\\mathbb{O}_n$ be the minimal nilpotent orbit in $\\mathfrak{sl}_n$. The affine closure of its cotangent bundle, $\\overline{T^*\\mathbb{O}_n}^{\\mathrm{aff}}$, is isomorphic to a $\\mathbb{C}^*$-Hamiltonian reduction of the minimal nilpotent orbit closure in the orthogonal Lie algebra $\\mathfrak{so}_m$. What is $m$ as a function of $n$?\n", "official_answer": "2n+2", "extracted_answer": "m = 2n+2", "tail_reply": "...ght side.** For $\\mathfrak{so}_m$, the dual Coxeter number is $h^\\vee = m-2$, so the minimal orbit closure has dimension $2(m-2)-2 = 2m-6$. A Hamiltonian reduction by $\\mathbb{C}^*$ (one complex dimension, with its one-dimensional moment map fixed at zero) cuts the dimension by 2, giving $2m-8$.\n\n**Matching.** Setting $2m-8 = 4n-4$ gives $m = 2n+2$.\n\nThis matches the structure expected from the quiver/hyperkähler description of $\\mathbb{O}_n$ as a $U(1)$-quotient of $\\mathbb{C}^{2n}$, but I have not verified the isomorphism itself. The dimension count is what pins down $m$.\n\nANSWER: $m = 2n+2$"}, {"item_id": "B_21_haiku__SOLVE__smt_2025_9__0", "solve_id": "haiku__SOLVE__smt_2025_9__0", "pid": "smt_2025_9", "attempt": "0", "comp": "smt_2025", "problem": "Consider the function \\,g(1)}{x-1}$ is $-A\\,g(1)$ for every $n$.\n\nTherefore\n$$\nd_n\\to -A\\,g(1)\\quad\\text{as } n\\to\\infty.\n$$\n\n**Evaluate.** With $g(1)=(2026)\\ln 2026$ and $A=\\tfrac12$:\n\n$$\n\\lim_{n\\to\\infty} d_n = -\\frac12\\cdot 2026\\ln 2026 = -1013\\ln 2026.\n$$\n\nANSWER: $-1013\\ln 2026$"}], "section_c": [{"item_id": "C_01_arxivmath-0126_14", "pid": "arxivmath-0126_14", "comp": "arxivmath-0126", "problem": "Let $q$ be a prime power and let $\\mathrm{PG}(n,q)$ be $n$-dimensional projective space over $\\mathbb F_q$. Let $M$ be the $\\{0,1\\}$ incidence matrix whose rows are indexed by the lines of $\\mathrm{PG}(n,q)$ and whose columns are indexed by the points of $\\mathrm{PG}(n,q)$, with $M_{\\ell,P}=1$ iff $P\\in\\ell$. Let $\\mathbb F_p$ be the prime-order subfield of $\\mathbb F_q$ and define the linear code $\\mathcal C_1(n,q)^\\perp:=\\ker_{\\mathbb F_p}(M)\\subseteq \\mathbb F_p^{\\#\\text{points}}$. Define its minimum (nonzero) Hamming weight by\n\\[\n d(n,q):=\\min\\{\\mathrm{wt}(c): c\\in\\mathcal C_1(n,q)^\\perp,\\ c\\neq 0\\}.\n\\]\nAssume $n>2$. What is the exact expression for $d(n,q)$ in terms of $d(2,q)$, $q$, and $n$?\n", "official_answer": "q^{n-2}d(2,q)", "attempts": [{"attempt": "0", "extracted_answer": "d(n,q)=q^{\\,n-2}\\,d(2,q)", "tail_reply": "...sum_{x\\in\\text{line}} c_\\pi(x)\\equiv 0 \\pmod p$.\n- A line that projects to a single point $x$ has sum $q\\,c_\\pi(x)\\equiv 0 \\pmod p$, since $q$ is a power of $p$.\n\nSo $c$ lies in the kernel. Each point of $\\pi$ has exactly $q^{n-2}$ preimages outside $S$, so $\\mathrm{wt}(c)=q^{n-2}\\,d(2,q)$. Hence $d(n,q)\\le q^{n-2}d(2,q)$.\n\n**Consistency check.** For $n>2$, the hyperplane difference $\\chi_{H_1}-\\chi_{H_2}$ is also a codeword, with weight $2q^{n-1}$. Since $d(2,q)\\le 2q$ (from the analogous construction in a plane), this is never smaller than $q^{n-2}d(2,q)$.\n\nANSWER: $d(n,q)=q^{\\,n-2}\\,d(2,q)$"}, {"attempt": "1", "extracted_answer": "d(n,q)=q^{\\,n-2}\\,d(2,q)", "tail_rep he vertical vector scaled by $\\cos\\varphi$, so\n$$1 - \\|\\nabla\\delta_M(p)\\|^2 = \\sin^2\\varphi \\sim \\varphi^2 \\sim t^{2\\alpha/(1-\\alpha)}.$$\n\n**Sanity checks.** As $\\alpha \\to 0$ the exponent tends to $0$, consistent with the lack of any gradient control for merely Lipschitz boundaries. The exponent blows up as $\\alpha \\to 1$, which fits the fact that the bound degenerates as the regularity approaches $C^{1,1}$ and beyond the threshold where the normal map stops being Hölder with exponent below one.\n\nANSWER: $\\beta = \\dfrac{2\\alpha}{1-\\alpha}$"}, {"attempt": "1", "extracted_answer": "\\beta = \\dfrac{2\\alpha}{1-\\alpha}", "tail_reply": "...e C t^{\\alpha} \\quad\\Longrightarrow\\quad \\theta \\lesssim t^{\\alpha/(1-\\alpha)}.$$\n\n**Deficit.** A convex combination of two unit vectors at angle $\\theta$ has norm about $\\cos(\\theta/2)$, so\n$$1-\\|\\nabla\\delta_M(p)\\|^2 \\approx \\theta^2/4 \\lesssim t^{2\\alpha/(1-\\alpha)}.$$\n\n**Consistency check.** As $\\alpha \\to 1$ the exponent tends to $\\infty$, matching the fact that $C^{1,1}$ submanifolds have a positive reach, so $\\|\\nabla\\delta_M\\| = 1$ near $M$. As $\\alpha \\to 0$ the exponent tends to $0$, so the deficit is only bounded, which is also plausible.\n\nANSWER: $\\beta = \\dfrac{2\\alpha}{1-\\alpha}$"}]}, {"item_id": "C_06_arxivmath-0226_22", "pid": "arxivmath-0226_22", "comp": "arxivmath-0226", "problem": "Consider the mean-field noisy Kuramoto-Daido model, which is governed by a McKean-Vlasov equation on the circle with the bimodal interaction $W(\\theta)=\\cos\\theta+m\\cos 2\\theta$, where $m\\ge 0$ is a parameter and $K$ is the interaction strength. Assume the noise level is normalized such that for the standard noisy Kuramoto model ($m=0$), the phase transition threshold is $K_c=1$. What is the exact value of the phase transition threshold $K_c$ as a function of $m$ in the regime where $m \\ge 2$?\n", "official_answer": "m^{-1}", "attempts": [{"attempt": "0", "extracted_answer": "K_c = \\dfrac{1}{m}", "tail_reply": "...r_2^2 < (1+r_2)\\,H_2,$$\n\nwhere $H_2$ is the entropy of the pure mode-2 state. Near the bifurcation $H_2\\approx r_2^2$, so this requires $m<1+r_2$. Since $r_2<1$, it can only hold for $m<2$. For $m\\ge 2$, mixing with the mode-1 component never lowers the threshold below $1/m$.\n\n**Caveat.** This is a local argument around the mode-2 branch. I did not carry out a full global minimization over all densities, so the claim that $1/m$ is the global threshold for $m\\ge2$ rests on this local analysis together with the regime boundary at $m=2$ matching the question's split.\n\nANSWER: $K_c = \\dfrac{1}{m}$"}, {"attempt": "1", "extracted_answer": "K_c = \\dfrac{1}{m}", "tail_reply": "...old below $1/m$.\n- For $m<2$, it becomes negative once $C > m-1$, which is what produces a regime change at $m=2$.\n\nI did not carry out a complete proof that $\\Phi \\ge 0$ globally. The local analysis and a spot check (one numerical test point at $m=2$ with $\\rho\\propto e^{\\cos\\theta+\\cos 2\\theta}$, where the ratio was $\\approx 0.62 > 0.5$) support the conclusion but do not establish it.\n\n**Conclusion.** The mode-2 bifurcation at $K=1/m$ is continuous (the cubic coefficient of the pure $\\cos 2\\theta$ branch is positive), and it is the global threshold for $m\\ge 2$.\n\nANSWER: $K_c = \\dfrac{1}{m}$"}]}, {"item_id": "C_07_arxivmath-0426_14", "pid": "arxivmath-0426_14", "comp": "arxivmath-0426", "problem": "Let $I_\\alpha(X; Y)$ denote Sibson's $\\alpha$-mutual information between a random variable $X$ and $Y = \\sqrt{\\mathsf{snr}} X + Z$, where $Z$ is standard Gaussian noise independent of $X$. Suppose $X$ has a discrete probability distribution (assume that if $\\alpha \\in (0,1)$, the gaps between adjacent support points of $X$ are bounded from above and bounded away from zero). In the high-SNR regime (as $\\mathsf{snr} \\to \\infty$), $I_\\alpha(X; Y)$ converges to the Rényi entropy $H_\\beta(X)$ of some order $\\beta$. What is $\\beta$ as a function of $\\alpha$?\n", "official_answer": "\\frac{1}{\\alpha}", "attempts": [{"attempt": "0", "extracted_answer": "\\beta = 1/\\alpha", "tail_reply": ".../\\alpha}.$$\n\nTherefore\n\n$$\\lim_{\\mathsf{snr}\\to\\infty} I_\\alpha(X;Y)=\\frac{\\alpha}{\\alpha-1}\\log\\sum_j p_j^{1/\\alpha}=\\frac{1}{1-\\beta}\\log\\sum_j p_j^{\\beta}\\Big|_{\\beta=1/\\alpha}=H_{1/\\alpha}(X),$$\n\nsince $\\frac{1}{1-1/\\alpha}=\\frac{\\alpha}{\\alpha-1}$.\n\n**Consistency check.** As $\\alpha\\to1$, $\\beta\\to1$ and the limit is the Shannon entropy $H(X)$, which matches the known high-SNR behaviour of Shannon mutual information for discrete inputs. This heuristic does not verify the boundary conditions on the support gaps for $\\alpha\\in(0,1)$; it only identifies the order.\n\nANSWER: $\\beta = 1/\\alpha$"}, {"attempt": "1", "extracted_answer": "\\beta = 1/\\alpha", "tail_reply": "... Summing over peaks,\n\n$$\\int \\Big(\\sum_x P(x)\\, p(y|x)^\\alpha\\Big)^{1/\\alpha} dy \\;\\to\\; \\sum_k P_k^{1/\\alpha}.$$\n\nTherefore\n\n$$I_\\alpha(X;Y) \\to \\frac{\\alpha}{\\alpha-1}\\log\\sum_k P_k^{1/\\alpha}.$$\n\n**Identifying the Rényi order.** The Rényi entropy of order $\\beta$ is $H_\\beta(X) = \\frac{1}{1-\\beta}\\log\\sum_k P_k^\\beta$. Setting $\\beta = 1/\\alpha$ gives $\\frac{1}{1-1/\\alpha} = \\frac{\\alpha}{\\alpha-1}$, which matches the prefactor exactly. As a check, $\\alpha\\to 1$ recovers the Shannon entropy, consistent with the known high-SNR limit of ordinary mutual information.\n\nANSWER: $\\beta = 1/\\alpha$"}]}, {"item_id": "C_08_arxivmath-0426_22", "pid": "arxivmath-0426_22", "comp": "arxivmath-0426", "problem": "Let $m_s$ be the $\\mathbb{F}_q$-dimension of the space of morphisms over $\\overline{\\mathbb{F}}_{\\mathfrak{p}}$ of $\\tau$-degree at most $s$ between any two supersingular rank-$2$ Drinfeld $\\mathbb{F}_q[T]$-modules over $\\overline{\\mathbb{F}}_{\\mathfrak{p}}$ in characteristic $\\mathfrak{p}$ of degree $d$. It is known that this dimension stabilizes for all $s \\geq d-2$. What is the exact formula for $m_s$ in terms of $s$ and $d$ for $s \\geq d-2$?\n", "official_answer": "2(s+1)-(d-1)", "attempts": [{"attempt": "0", "extracted_answer": "m_s = 2s - d + 3", "tail_reply": "...mbeds in $D$ for $d\\ge 2$, so $\\varepsilon_2 = 1$ and hence $\\varepsilon_3 = d-1$. This step assumes the embedding lies in the relevant maximal order.\n\n   This gives $\\varepsilon = (0,1,d-1,d)$.\n\n5. **Summing.** Using $\\lfloor s/2\\rfloor+\\lfloor (s-1)/2\\rfloor = s-1$ and $\\lfloor (s-d+1)/2\\rfloor+\\lfloor (s-d)/2\\rfloor = s-d$:\n$$m_s=(s-1)+(s-d)+4 = 2s-d+3.$$\n\n## Checks\n\n- $d=1$: the explicit model $\\mathrm{End}=\\bigoplus_i \\mathbb{F}_{q^2}\\,e_i\\tau^i$ gives $m_s=2s+2$, matching the formula.\n- $d=2$: direct counting gives $m_0=1$, $m_1=3$, $m_2=5$, matching $2s-d+3$.\n\nANSWER: $m_s = 2s - d + 3$"}, {"attempt": "1", "extracted_answer": "m_s = 2s - d + 3", "tail_reply": "...he discriminant is ramified at $\\mathfrak{p}$ and at $\\infty$, so its degree is $d+1$, giving $\\chi_0 = 3 - d$. I did not verify the vanishing of $h^1$ for $s \\ge d-2$ or the covolume normalization in detail.\n\n**Checks.**\n- $d=1$, $s=-1$: $m_{-1} = 2(-1)+3-1 = 0$, as required since $\\tau$-degree $\\le -1$ forces the zero map.\n- $d=1$, $s=0$: $m_0 = 2$, matching the $\\mathbb{F}_{q^2}$ of constant automorphisms (for $d$ odd, $\\mathbb{F}_{q^2}(T)$ embeds in $D$).\n- $d=2$, $s=0$: $m_0 = 1$, matching the identity alone (the constant field does not embed when $d$ is even).\n\nANSWER: $m_s = 2s - d + 3$"}]}, {"item_id": "C_09_arxivmath-0526_1", "pid": "arxivmath-0526_1", "comp": "arxivmath-0526", "problem": "Let $m$ be a fixed positive integer. For each integer $n > m$, let $\\lambda_n \\vdash n$ be a partition that is either a hook shape or a two-row shape, such that the sum of all parts of $\\lambda_n$ excluding its largest part is exactly equal to $m$. Let $\\sigma_n \\in S_n$ be a uniformly random permutation chosen from the set of all permutations whose Robinson-Schensted shape is $\\lambda_n$. As $n \\to \\infty$, what is the limiting value of the expected proportion of fixed points in $\\sigma_n$?\n", "official_answer": "\\frac{(2m)!!}{(2m+1)!!}", "attempts": [{"attempt": "0", "extracted_answer": "\\dfrac{4^m\\,(m!)^2}{(2m+1)!}", "tail_reply": "...xt{proportion}] = \\int_0^1 \\sum_{k=0}^m \\binom{m}{k}^2 x^{2k}(1-x)^{2m-2k}\\,dx = \\sum_{k=0}^m \\binom{m}{k}^2 \\frac{(2k)!\\,(2m-2k)!}{(2m+1)!}.$$\nUsing $\\binom{m}{k}^2(2k)!(2m-2k)! = (m!)^2\\binom{2k}{k}\\binom{2m-2k}{m-k}$ and the identity $\\sum_k \\binom{2k}{k}\\binom{2m-2k}{m-k} = 4^m$, this becomes\n$$\\frac{4^m (m!)^2}{(2m+1)!}.$$\n\n**Check.** For $m=1$ the formula gives $2/3$. This matches a direct computation: moving one entry from position $i$ to $j$ leaves $n-|i-j|-1$ fixed points, and $\\mathbb{E}|U-V| = 1/3$ for uniform $U,V$. For $m=2$ it gives $8/15$.\n\nANSWER: $\\dfrac{4^m\\,(m!)^2}{(2m+1)!}$"}, {"attempt": "1", "extracted_answer": "\\dfrac{4^m}{(2m+1)\\binom{2m}{m}}", "tail_reply": "...sum_{k=0}^{m}\\frac{\\binom{2k}{k}\\binom{2m-2k}{m-k}}{\\binom{2m}{m}}=\\frac{4^m}{\\binom{2m}{m}},$$\nusing the identity $\\sum_{k=0}^m\\binom{2k}{k}\\binom{2m-2k}{m-k}=4^m$.\n\n**6. Check at $m=1$.** Here $\\lambda=(n-1,1)$, and the permutations are single-element moves. Moving an element by a fraction $x$ of $n$ leaves a fixed-point proportion of $1-x$, with $x$ having density $2(1-x)$ on $[0,1]$. This gives $\\mathbb E[1-x]=2/3$, which agrees with the formula: $4/(3\\cdot 2)=2/3$.\n\nThe $m=2$ value from the formula is $8/15$. I did not verify this independently.\n\nANSWER: $\\dfrac{4^m}{(2m+1)\\binom{2m}{m}}$"}]}, {"item_id": "C_10_arxivmath-0526_10", "pid": "arxivmath-0526_10", "comp": "arxivmath-0526", "problem": "For an integer $N \\geq 2$, consider the set of affine surfaces $S_{a_1,a_2,a_3} = V(x_1^{a_1} + x_2^{a_2} + x_3^{a_3} + 1) \\subset \\mathbb{A}^3$ over $\\mathbb{C}$, where $a_1, a_2, a_3$ are integers such that $2 \\leq a_1 \\leq a_2 \\leq a_3 \\leq N$. How many pairwise non-isomorphic surfaces are in this set, as a function of $N$?\n", "official_answer": "\\binom{N+1}{3}", "attempts": [{"attempt": "0", "extracted_answer": "\\frac{(N-1)N(N+1)}{6}", "tail_reply": "...ultisets are taken to be non-isomorphic.** I assumed that distinct multisets give non-isomorphic affine surfaces. This is consistent with invariants such as the Milnor number $(a_1-1)(a_2-1)(a_3-1)$ and the structure of the boundary at infinity, but I did not prove it here.\n\n3. **Count the nondecreasing triples.** The values $a_i$ range over the $N-1$ integers $\\{2,\\dots,N\\}$. The number of multisets of size 3 from an $(N-1)$-element set is\n$$\\binom{(N-1)+3-1}{3} = \\binom{N+1}{3}.$$\n\n4. **Check.** For $N=2$ the only triple is $(2,2,2)$, giving $1=\\binom{3}{3}$.\n\nANSWER: $\\frac{(N-1)N(N+1)}{6}$"}, {"attempt": "1", "extracted_answer": "\\binom{N+1}{3}=\\frac{(N-1)N(N+1)}{6}", "tail_reply": "...nciples or check it against the literature. It is consistent with the structure at infinity, which is determined by the exponents, but I have not ruled out exceptional isomorphisms when some exponents equal 2.\n\n**Counting.** Under this assumption, isomorphism classes correspond to multisets $\\{a_1,a_2,a_3\\}$ drawn from $\\{2,\\dots,N\\}$. That set has $m = N-1$ elements. The number of multisets of size 3 from an $m$-element set is $\\binom{m+2}{3}$, which gives $\\binom{N+1}{3}$.\n\n**Check at $N=2$.** The only triple is $(2,2,2)$, and $\\binom{3}{3}=1$.\n\nANSWER: $\\binom{N+1}{3}=\\frac{(N-1)N(N+1)}{6}$"}]}, {"item_id": "C_11_arxivmath-0526_19", "pid": "arxivmath-0526_19", "comp": "arxivmath-0526", "problem": "Let $\\mathcal{T}_n$ be the set of plane binary trees (rooted trees where every internal node has exactly two ordered children) with $n$ internal nodes. Let $\\kappa[m]$ be the limit as $n \\to \\infty$ of the probability that a tree chosen uniformly at random from $\\mathcal{T}_n$ has e const STORAGE_KEY = "c3_v2_human_audit_state_v1";

const OPTIONS = {
  a: [
    "All 3 genuinely wrong",
    "Hidden equivalent right answer",
    "Broken prompt",
    "Unsure"
  ],
  b: [
    "Correct",
    "Wrong",
    "Unsure"
  ],
  c: [
    "SOLVED (both right)",
    "MIXED (one right)",
    "UNSOLVED (both wrong)",
    "Unsure"
  ]
};

let currentTab = "a";
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { responses: {} };
  } catch (e) {
    return { responses: {} };
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function setResponse(section, itemId, verdict) {
  if (!state.responses[itemId]) state.responses[itemId] = { section: section, verdict: "", note: "" };
  state.responses[itemId].section = section;
  state.responses[itemId].verdict = verdict;
  state.responses[itemId].updated_at = new Date().toISOString();
  saveState();
  updateProgress();
  render();
}

function setNote(section, itemId, note) {
  if (!state.responses[itemId]) state.responses[itemId] = { section: section, verdict: "", note: "" };
  state.responses[itemId].section = section;
  state.responses[itemId].note = note;
  state.responses[itemId].updated_at = new Date().toISOString();
  saveState();
}

function setTab(tab) {
  currentTab = tab;
  document.getElementById("tab-a").classList.toggle("active", tab === "a");
  document.getElementById("tab-b").classList.toggle("active", tab === "b");
  document.getElementById("tab-c").classList.toggle("active", tab === "c");
  render();
}

function countSection(secKey, items) {
  let done = 0;
  for (const it of items) {
    const r = state.responses[it.item_id];
    if (r && r.verdict) done += 1;
  }
  return done;
}

  const aTot = AUDIT_DATA.section_a.length;
  const bTot = AUDIT_DATA.section_b.length;
  const cTot = AUDIT_DATA.section_c.length;
  const totDone = aDone + bDone + cDone;
  const totAll = aTot + bTot + cTot;
  document.getElementById("prog-a").textContent = aDone + "/" + aTot;
  document.getElementById("prog-b").textContent = bDone + "/" + bTot;
  document.getElementById("prog-c").textContent = cDone + "/" + cTot;
  document.getElementById("overall-progress").textContent = totDone + " / " + totAll + " completed";
}

function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderRadios(section, itemId, currentVal) {
  return OPTIONS[section].map(opt => {
    const checked = currentVal === opt;
    const cls = checked ? "radio-pill selected" : "radio-pill";
    const safeOpt = esc(opt);
    return `<label class="${cls}">
      <input type="radio" name="rad_${esc(itemId)}" value="${safeOpt}" ${checked ? "checked" : ""}
        onchange='setResponse("${section}", ${JSON.stringify(itemId)}, ${JSON.stringify(opt)})'>
      <span>${safeOpt}</span>
    </label>`;
  }).join("");
}

function render() {
  const app = document.getElementById("app");
  const filterUnanswered = document.getElementById("unanswered-only").checked;
  const items = currentTab === "a" ? AUDIT_DATA.section_a : (currentTab === "b" ? AUDIT_DATA.section_b : AUDIT_DATA.section_c);
  const visible = items.filter(it => {
    if (!filterUnanswered) return true;
    const r = state.responses[it.item_id];
    return !(r && r.verdict);
  });

  if (visible.length === 0) {
    app.innerHTML = `<div class="card"><p>No items match the current filter.</p></div>`;
    return;
  }

  let html = "";
  for (const it of visible) {
    const resp = state.responses[it.item_id] || { verdict: "", note: "" };
    const isDone = Boolean(resp.verdict);
    const doneBadge = isDone ? `<span class="badge done-badge">Recorded: ${esc(resp.verdict)}</span>` : `<span class="badge">Pending</span>`;

    let bodyHtml = "";
    if (currentTab === "a") {
      const candsHtml = it.candidates.map(c => `
        <div class="cand-card">
          <div class="cand-title">Candidate ${c.index}</div>
          <div class="block-label">Candidate Final Answer</div>
          <pre class="box">${esc(c.answer)}</pre>
          <div class="block-label">Last 400 Chars of Reasoning</div>
          <pre class="box">${esc(c.tail_reasoning)}</pre>
        </div>
      `).join("");
      bodyHtml = `
        <div class="block-label">Problem</div>
        <pre class="box">${esc(it.problem)}</pre>
        <div class="block-label">Official Answer</div>
        <pre class="box gold-box">${esc(it.official_answer)}</pre>
        <div class="block-label">3 Candidate Solutions (Blinded)</div>
        <div class="cand-grid">${candsHtml}</div>
      `;
    } else if (currentTab === "b") {
      bodyHtml = `
        <div class="block-label">Problem</div>
        <pre class="box">${esc(it.problem)}</pre>
        <div class="block-label">Official Answer</div>
        <pre class="box gold-box">${esc(it.official_answer)}</pre>
        <div class="block-label">Extracted Subject Answer (Attempt ${esc(it.attempt)})</div>
        <pre class="box">${esc(it.extracted_answer)}</pre>
        <div class="block-label">Last 600 Chars of SOLVE Reply</div>
        <pre class="box">${esc(it.tail_reply)}</pre>
      `;
    } else {
      const attHtml = it.attempts.map(a => `
        <div class="cand-card">
          <div class="cand-title">Attempt ${esc(a.attempt)}</div>
          <div class="block-label">Extracted Answer</div>
          <pre class="box">${esc(a.extracted_answer)}</pre>
          <div class="block-label">Last 600 Chars of SOLVE Reply</div>
          <pre class="box">${esc(a.tail_reply)}</pre>
        </div>
      `).join("");
      bodyHtml = `
        <div class="block-label">Problem</div>
        <pre class="box">${esc(it.problem)}</pre>
        <div class="block-label">Official Answer</div>
        <pre class="box gold-box">${esc(it.official_answer)}</pre>
        <div class="block-label">Two SOLVE Attempts (Blinded)</div>
        <div class="cand-grid">${attHtml}</div>
      `;
    }

    html += `
      <div class="card ${isDone ? "done" : ""}">
        <div class="card-head">
          <div>
            <strong>${esc(it.item_id)}</strong>
            <span class="badge">${esc(it.comp)}</span>
          </div>
          ${doneBadge}
        </div>
        ${bodyHtml}
        <div class="radios">${renderRadios(currentTab, it.item_id, resp.verdict)}</div>
        <input type="text" class="note-input" placeholder="Optional audit note..." value="${esc(resp.note)}"
          onchange='setNote("${currentTab}", ${JSON.stringify(it.item_id)}, this.value)'>
      </div>
    `;
  }
  app.innerHTML = html;
}

function downloadJSON() {
  const payload = {
    exported_at: new Date().toISOString(),
    meta: AUDIT_DATA.meta,
    progress: {
      section_a_done: countSection("a", AUDIT_DATA.section_a),
      section_b_done: countSection("b", AUDIT_DATA.section_b),
      section_c_done: countSection("c", AUDIT_DATA.section_c),
    },
    responses: state.responses,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "human_audit_results.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetAll() {
  if (!confirm("Clear all recorded audit answers from local browser storage?")) return;
  state = { responses: {} };
  saveState();
  updateProgress();
  render();
}

updateProgress();
render();
</script>
</body>
</html>
